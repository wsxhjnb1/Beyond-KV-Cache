name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Check Python syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Run CPU contracts
        run: |
          python -m pytest -q \
            tests/test_common_hashing.py \
            tests/test_early_stopping.py \
            tests/runtime/vllm/test_runtime_config.py \
            tests/test_sm100_nonuniform_decode_policy.py
