[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-kv"
version = "0.1.0"
description = "Learned non-uniform KV-cache quantization for training and vLLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Yuhao Xie" },
  { name = "Mingjie Lin" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/wsxhjnb1/Beyond-KV-Cache"
Issues = "https://github.com/wsxhjnb1/Beyond-KV-Cache/issues"

[project.scripts]
beyond-train = "beyond.train.__main__:main"
beyond-serve = "beyond.inference.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["beyond*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests", "quant/tests"]
pythonpath = [".", "src"]
xfail_strict = true
markers = [
  "unit: tests that do not require a GPU, network access, or model downloads",
  "gpu: tests that require a CUDA-capable NVIDIA GPU",
  "integration: tests spanning multiple components or external runtimes",
  "slow: tests unsuitable for the default pull-request check",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "quant/fa4_cute",
  "quant/beyond_cute.py",
  "src/beyond/runtime/vllm/packed_backend.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/beyond/inference/cli.py" = ["E402"]
"src/beyond/train/cli.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["beyond", "quant"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
